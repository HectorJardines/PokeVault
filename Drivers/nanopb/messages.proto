syntax = "proto2";

message msg {
    required uint32 node_id = 2;
    required uint32 timestamp = 3;

    oneof payload {
        alert type_alert = 4;
        transaction type_transaction = 5;
        event type_event = 6;
    }
}

message alert {
    required uint32 type = 2;
}


message transaction {
    required uint32 type = 2;
    required uint32 item_id = 3;
}


message event {
    required uint32 type = 2;
}